<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1e1b4b"/><stop offset="0.55" stop-color="#2e1065"/><stop offset="1" stop-color="#4a044e"/>
  </linearGradient>
  <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5"><stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="0.1" cy="1" r="0.6"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.25"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/></pattern>
  <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .in{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
    .a1{animation-delay:.1s}.a2{animation-delay:.35s}.a3{animation-delay:.7s}.a4{animation-delay:.9s}.a5{animation-delay:1.1s}.a6{animation-delay:1.4s}
    @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite}
    .b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}.b5{animation-delay:1.2s}
    @keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    .line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 4s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:420}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .float{animation:float 5s ease-in-out infinite}.f2{animation-delay:1.5s}.f3{animation-delay:3s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .twinkle{animation:tw 2.4s ease-in-out infinite}.t2{animation-delay:.8s}.t3{animation-delay:1.6s}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#glow1)"/>
  <rect width="1200" height="320" fill="url(#glow2)"/>

  <!-- sparkles -->
  <g fill="#fde68a">
    <path class="twinkle" d="M620 50l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/>
    <path class="twinkle t2" d="M1150 270l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <path class="twinkle t3" d="M700 280l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <path class="twinkle t2" d="M560 250l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
  </g>

  <!-- text -->
  <text class="in a1" x="70" y="100" font-size="24" fill="#f9a8d4" font-weight="600">Hi there, I'm</text>
  <text class="in a2" x="68" y="168" font-size="68" fill="#ffffff" font-weight="800" letter-spacing="-1">Bhakti Pasnani</text>

  <g class="in a3"><rect x="70" y="196" width="140" height="36" rx="18" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="140" y="220" font-size="16" fill="#5eead4" font-weight="700" text-anchor="middle">Data Analyst</text></g>
  <g class="in a4"><rect x="222" y="196" width="104" height="36" rx="18" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-width="1.5"/>
    <text x="274" y="220" font-size="16" fill="#f9a8d4" font-weight="700" text-anchor="middle">Product</text></g>
  <g class="in a5"><rect x="338" y="196" width="222" height="36" rx="18" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="449" y="220" font-size="16" fill="#fde68a" font-weight="700" text-anchor="middle">Data Science Engineer</text></g>

  <text class="in a6" x="70" y="272" font-size="16" fill="#c4b5fd">MS Data Science @ Northeastern University  ·  Boston, MA</text>

  <!-- dashboard card -->
  <g class="float">
    <rect x="780" y="54" width="330" height="200" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="804" cy="76" r="5" fill="#fb7185"/><circle cx="820" cy="76" r="5" fill="#fbbf24"/><circle cx="836" cy="76" r="5" fill="#2dd4bf"/>
    <!-- bars -->
    <g>
      <rect class="bar" x="808" y="130" width="22" height="100" rx="5" fill="#2dd4bf"/>
      <rect class="bar b2" x="840" y="150" width="22" height="80" rx="5" fill="#a78bfa"/>
      <rect class="bar b3" x="872" y="110" width="22" height="120" rx="5" fill="#f472b6"/>
      <rect class="bar b4" x="904" y="140" width="22" height="90" rx="5" fill="#fbbf24"/>
      <rect class="bar b5" x="936" y="120" width="22" height="110" rx="5" fill="#2dd4bf"/>
    </g>
    <!-- donut -->
    <circle cx="1040" cy="130" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="12"/>
    <g class="spin">
      <circle cx="1040" cy="130" r="34" fill="none" stroke="#f472b6" stroke-width="12" stroke-dasharray="120 214" stroke-linecap="round"/>
      <circle cx="1040" cy="130" r="34" fill="none" stroke="#2dd4bf" stroke-width="12" stroke-dasharray="60 214" stroke-dashoffset="-135" stroke-linecap="round"/>
    </g>
    <!-- line chart -->
    <polyline class="line" points="990,228 1010,210 1030,218 1050,192 1070,200 1092,176" fill="none" stroke="#fde68a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating chips -->
  <g class="float f2"><rect x="700" y="210" width="72" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.18" stroke="#2dd4bf"/><text x="736" y="230" font-size="13" fill="#5eead4" text-anchor="middle" font-weight="700">SQL</text></g>
  <g class="float f3"><rect x="1120" y="40" width="64" height="30" rx="15" fill="#f472b6" fill-opacity="0.18" stroke="#f472b6"/><text x="1152" y="60" font-size="13" fill="#f9a8d4" text-anchor="middle" font-weight="700">ML</text></g>
  <g class="float"><rect x="690" y="80" width="78" height="30" rx="15" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24"/><text x="729" y="100" font-size="13" fill="#fde68a" text-anchor="middle" font-weight="700">Python</text></g>
</g>
</svg>