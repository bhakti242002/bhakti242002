<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#170f2e"/></linearGradient>
  <radialGradient id="gl" cx="0.9" cy="0.1" r="0.6"><stop offset="0" stop-color="#f472b6" stop-opacity="0.22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .in{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .run{stroke-dasharray:90 910;animation:run 5s linear infinite}
    @keyframes run{to{stroke-dashoffset:-1000}}
    .ring{stroke-dasharray:0 100;animation:fill 1.8s cubic-bezier(.2,.8,.2,1) .7s forwards}
    @keyframes fill{to{stroke-dasharray:100 100}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
    @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
    .orbit{transform-origin:760px 108px;animation:orb 7s linear infinite}
    @keyframes orb{to{transform:rotate(360deg)}}
  </style>
</defs>
<rect x="2" y="2" width="876" height="236" rx="22" fill="url(#bg)" stroke="#312e81" stroke-width="2"/>
<rect x="2" y="2" width="876" height="236" rx="22" fill="url(#gl)"/>
<rect class="run" x="2" y="2" width="876" height="236" rx="22" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" pathLength="1000"/>
<text x="625" y="224" font-size="120" font-weight="900" fill="#f472b6" fill-opacity="0.07" text-anchor="end">02</text>

<g class="in" style="animation-delay:.1s"><rect x="40" y="28" width="179" height="28" rx="14" fill="#f472b6" fill-opacity="0.16"/>
<text x="129.5" y="47" font-size="12" fill="#f9a8d4" font-weight="800" letter-spacing="1.5" text-anchor="middle">FULL-STACK AI APP</text></g>
<g class="in" style="animation-delay:.2s"><circle class="pulse" cx="241" cy="42" r="10" fill="#f472b6" fill-opacity="0.35"/><circle cx="241" cy="42" r="5" fill="#f472b6"/><text x="255" y="47" font-size="13" fill="#f9a8d4" font-weight="700" letter-spacing="1.5">LIVE</text></g>
<text class="in" style="animation-delay:.3s" x="40" y="92" font-size="28" font-weight="800" fill="#ffffff">Insight Bridge</text>
<text class="in" style="animation-delay:0.45s" x="40" y="124" font-size="15" fill="#cbd5e1">Upload any messy spreadsheet and get a working dashboard, with zero setup.</text><text class="in" style="animation-delay:0.57s" x="40" y="146" font-size="15" fill="#cbd5e1">Statistical type inference reads every column. AI suggests labels and answers</text><text class="in" style="animation-delay:0.69s" x="40" y="168" font-size="15" fill="#cbd5e1">plain-English questions, but every number on screen is computed by code.</text>
<g class="in" style="animation-delay:0.90s"><rect x="40" y="186" width="70" height="28" rx="14" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.6"/><text x="75.0" y="205" font-size="13" fill="#f9a8d4" text-anchor="middle" font-weight="600">Python</text></g><g class="in" style="animation-delay:1.02s"><rect x="118" y="186" width="63" height="28" rx="14" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.6"/><text x="149.5" y="205" font-size="13" fill="#f9a8d4" text-anchor="middle" font-weight="600">Flask</text></g><g class="in" style="animation-delay:1.14s"><rect x="189" y="186" width="63" height="28" rx="14" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.6"/><text x="220.5" y="205" font-size="13" fill="#f9a8d4" text-anchor="middle" font-weight="600">React</text></g><g class="in" style="animation-delay:1.26s"><rect x="260" y="186" width="100" height="28" rx="14" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.6"/><text x="310.0" y="205" font-size="13" fill="#f9a8d4" text-anchor="middle" font-weight="600">Claude API</text></g><g class="in" style="animation-delay:1.38s"><rect x="368" y="186" width="85" height="28" rx="14" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.6"/><text x="410.5" y="205" font-size="13" fill="#f9a8d4" text-anchor="middle" font-weight="600">Supabase</text></g>

<!-- metric ring -->
<g class="in" style="animation-delay:.5s">
<circle cx="760" cy="108" r="64" fill="none" stroke="#312e81" stroke-width="10"/>
<circle class="ring" cx="760" cy="108" r="64" fill="none" stroke="#f472b6" stroke-width="10" stroke-linecap="round" pathLength="100" transform="rotate(-90 760 108)"/>
<g class="orbit"><circle cx="760" cy="30" r="4" fill="#f9a8d4"/></g>
<text x="760" y="112" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">240x</text>
<text x="760" y="132" font-size="10.5" font-weight="800" fill="#f9a8d4" text-anchor="middle" letter-spacing="1.2">FASTER</text>
