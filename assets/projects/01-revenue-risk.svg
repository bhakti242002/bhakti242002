<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#170f2e"/></linearGradient>
  <radialGradient id="gl" cx="0.9" cy="0.1" r="0.6"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .in{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .run{stroke-dasharray:90 910;animation:run 5s linear infinite}
    @keyframes run{to{stroke-dashoffset:-1000}}
    .ring{stroke-dasharray:0 100;animation:fill 1.8s cubic-bezier(.2,.8,.2,1) .7s forwards}
    @keyframes fill{to{stroke-dasharray:62 100}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
    @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
    .orbit{transform-origin:760px 108px;animation:orb 7s linear infinite}
    @keyframes orb{to{transform:rotate(360deg)}}
  </style>
</defs>
<rect x="2" y="2" width="876" height="236" rx="22" fill="url(#bg)" stroke="#312e81" stroke-width="2"/>
<rect x="2" y="2" width="876" height="236" rx="22" fill="url(#gl)"/>
<rect class="run" x="2" y="2" width="876" height="236" rx="22" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" pathLength="1000"/>
<text x="625" y="224" font-size="120" font-weight="900" fill="#2dd4bf" fill-opacity="0.07" text-anchor="end">01</text>

<g class="in" style="animation-delay:.1s"><rect x="40" y="28" width="161" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.16"/>
<text x="120.5" y="47" font-size="12" fill="#5eead4" font-weight="800" letter-spacing="1.5" text-anchor="middle">LIVE ML PRODUCT</text></g>
<g class="in" style="animation-delay:.2s"><circle class="pulse" cx="223" cy="42" r="10" fill="#2dd4bf" fill-opacity="0.35"/><circle cx="223" cy="42" r="5" fill="#2dd4bf"/><text x="237" y="47" font-size="13" fill="#5eead4" font-weight="700" letter-spacing="1.5">LIVE</text></g>
<text class="in" style="animation-delay:.3s" x="40" y="92" font-size="28" font-weight="800" fill="#ffffff">Live Revenue Risk Check</text>
<text class="in" style="animation-delay:0.45s" x="40" y="124" font-size="15" fill="#cbd5e1">Type any public company&#x27;s ticker and get a live revenue-decline risk score.</text><text class="in" style="animation-delay:0.57s" x="40" y="146" font-size="15" fill="#cbd5e1">Every request pulls real 10-K data from SEC EDGAR, engineers features, and</text><text class="in" style="animation-delay:0.69s" x="40" y="168" font-size="15" fill="#cbd5e1">runs a Random Forest trained on a time-based split (2009-2020 to 2021+).</text>
<g class="in" style="animation-delay:0.90s"><rect x="40" y="186" width="70" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.6"/><text x="75.0" y="205" font-size="13" fill="#5eead4" text-anchor="middle" font-weight="600">Python</text></g><g class="in" style="animation-delay:1.02s"><rect x="118" y="186" width="100" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.6"/><text x="168.0" y="205" font-size="13" fill="#5eead4" text-anchor="middle" font-weight="600">Serverless</text></g><g class="in" style="animation-delay:1.14s"><rect x="226" y="186" width="114" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.6"/><text x="283.0" y="205" font-size="13" fill="#5eead4" text-anchor="middle" font-weight="600">Scikit-learn</text></g><g class="in" style="animation-delay:1.26s"><rect x="348" y="186" width="122" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.6"/><text x="409.0" y="205" font-size="13" fill="#5eead4" text-anchor="middle" font-weight="600">SEC EDGAR API</text></g><g class="in" style="animation-delay:1.38s"><rect x="478" y="186" width="70" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.6"/><text x="513.0" y="205" font-size="13" fill="#5eead4" text-anchor="middle" font-weight="600">Vercel</text></g>

<!-- metric ring -->
<g class="in" style="animation-delay:.5s">
<circle cx="760" cy="108" r="64" fill="none" stroke="#312e81" stroke-width="10"/>
<circle class="ring" cx="760" cy="108" r="64" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round" pathLength="100" transform="rotate(-90 760 108)"/>
<g class="orbit"><circle cx="760" cy="30" r="4" fill="#5eead4"/></g>
<text x="760" y="112" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">0.62</text>
<text x="760" y="132" font-size="10.5" font-weight="800" fill="#5eead4" text-anchor="middle" letter-spacing="1.2">ROC-AUC</text>
<text x="760" y="206" font-size="12.5" fill="#a5b4fc" text-anchor="middle">50% recall vs 0% baseline</text>
</g>
</svg>