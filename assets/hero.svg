<svg xmlns="http://www.w3.org/2000/svg" width="460" height="380" viewBox="0 0 460 380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><style>
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 2.8s ease-in-out infinite}
  .b2{animation-delay:.4s}.b3{animation-delay:.8s}.b4{animation-delay:1.2s}
  @keyframes grow{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .code{transform-box:fill-box;transform-origin:left;animation:type 3s steps(12) infinite}
  .c2{animation-delay:.5s}.c3{animation-delay:1s}.c4{animation-delay:1.5s}.c5{animation-delay:2s}
  @keyframes type{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .steam{animation:steam 2.6s ease-in-out infinite;opacity:0}.s2{animation-delay:1.3s}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-14px)}}
  .type{animation:tap .5s ease-in-out infinite alternate}
  @keyframes tap{to{transform:translateY(2px)}}
  .blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .sway{transform-origin:392px 172px;animation:sway 3s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
  .heart{animation:heart 3s ease-in-out infinite;opacity:0}
  @keyframes heart{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
</style></defs>

<!-- floor blob -->
<path d="M0 300 C 90 250, 180 330, 300 270 S 440 230, 460 250 L460 380 L0 380 Z" fill="#2e1065"/>
<!-- desk -->
<path d="M30 250 L420 250 L440 272 L10 272 Z" fill="#ede9fe"/>
<rect x="40" y="272" width="10" height="70" fill="#c4b5fd"/><rect x="400" y="272" width="10" height="70" fill="#c4b5fd"/>

<!-- plant -->
<rect x="44" y="222" width="26" height="28" rx="4" fill="#f472b6"/>
<g fill="#2dd4bf"><ellipse cx="50" cy="210" rx="6" ry="14" transform="rotate(-25 50 210)"/><ellipse cx="64" cy="208" rx="6" ry="15" transform="rotate(20 64 208)"/><ellipse cx="57" cy="202" rx="5" ry="15"/></g>

<!-- monitor left: code -->
<rect x="80" y="112" width="140" height="96" rx="8" fill="#1e1b4b"/>
<rect x="88" y="120" width="124" height="80" rx="4" fill="#312e81"/>
<rect class="code" x="96" y="130" width="70" height="6" rx="3" fill="#5eead4"/>
<rect class="code c2" x="104" y="144" width="90" height="6" rx="3" fill="#f9a8d4"/>
<rect class="code c3" x="104" y="158" width="60" height="6" rx="3" fill="#fde68a"/>
<rect class="code c4" x="96" y="172" width="80" height="6" rx="3" fill="#c4b5fd"/>
<rect class="code c5" x="104" y="186" width="50" height="6" rx="3" fill="#5eead4"/>
<rect x="138" y="208" width="24" height="26" fill="#1e1b4b"/><rect x="120" y="232" width="60" height="8" rx="4" fill="#1e1b4b"/>

<!-- monitor right: dashboard -->
<rect x="230" y="84" width="170" height="120" rx="8" fill="#1e1b4b"/>
<rect x="238" y="92" width="154" height="104" rx="4" fill="#312e81"/>
<circle cx="272" cy="126" r="20" fill="none" stroke="#4c1d95" stroke-width="10"/>
<g class="spin"><circle cx="272" cy="126" r="20" fill="none" stroke="#f472b6" stroke-width="10" stroke-dasharray="70 126"/></g>
<rect class="bar" x="310" y="110" width="12" height="36" rx="3" fill="#2dd4bf"/>
<rect class="bar b2" x="328" y="120" width="12" height="26" rx="3" fill="#fbbf24"/>
<rect class="bar b3" x="346" y="104" width="12" height="42" rx="3" fill="#f472b6"/>
<rect class="bar b4" x="364" y="116" width="12" height="30" rx="3" fill="#a78bfa"/>
<polyline points="250,184 272,170 294,178 318,160 342,168 378,152" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="302" y="204" width="26" height="30" fill="#1e1b4b"/><rect x="284" y="232" width="62" height="8" rx="4" fill="#1e1b4b"/>

<!-- keyboard -->
<rect x="190" y="240" width="110" height="10" rx="4" fill="#4c1d95"/>

<!-- coffee -->
<rect x="116" y="234" width="18" height="16" rx="3" fill="#fbbf24"/>
<path d="M134 238 q7 0 7 5 q0 5 -7 5" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
<path class="steam" d="M121 228 q-3 -5 0 -10 q3 -5 0 -10" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
<path class="steam s2" d="M129 228 q-3 -5 0 -10 q3 -5 0 -10" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>

<!-- chair -->
<rect x="360" y="226" width="70" height="90" rx="16" fill="#4c1d95"/>
<rect x="390" y="316" width="10" height="30" fill="#4c1d95"/><rect x="366" y="344" width="58" height="8" rx="4" fill="#4c1d95"/>

<!-- woman (seen from behind-right) -->
<!-- torso -->
<path d="M346 316 C 344 270, 352 236, 392 226 C 426 232, 438 270, 436 316 Z" fill="#ec4899"/>
<!-- arm reaching keyboard -->
<g class="type"><path d="M360 246 C 330 250, 300 246, 280 244" fill="none" stroke="#ec4899" stroke-width="18" stroke-linecap="round"/>
<circle cx="276" cy="244" r="8" fill="#d4a373"/></g>
<!-- neck -->
<rect x="382" y="204" width="18" height="24" rx="6" fill="#c08a5b"/>
