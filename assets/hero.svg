<rect x="356" y="180" width="12" height="20" rx="5" fill="#2dd4bf"/>
<!-- earring -->
<circle cx="363" cy="202" r="3" fill="#fbbf24"/>

<!-- floating hearts / sparkles -->
<text class="heart" x="420" y="120" font-size="18" fill="#f472b6">♥</text>
<path class="blink" d="M200 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fde68a"/>
</svg>