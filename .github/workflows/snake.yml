name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff6b6b&color_dots=#ebedf0,#ffd93d,#6bcb77,#4d96ff,#c77dff
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffd93d&color_dots=#161b22,#ff6b6b,#6bcb77,#4d96ff,#c77dff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
